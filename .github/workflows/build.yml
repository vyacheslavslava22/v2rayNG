name: Build NovaRay APK

# Runs on every push to master/main and on demand (Actions -> Build NovaRay APK -> Run workflow).
# Result: a GitHub Release "NovaRay <version>" with ready-to-install APK files.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '30.0.16248370'
  # Fallback revisions used only if the repository was uploaded without git submodules.
  XRAY_LIB_REPO: 'https://github.com/2dust/AndroidLibXrayLite'
  XRAY_LIB_SHA: '2ffe5f794a32ba15b122e177b5acffc6f11c4959'
  HEV_REPO: 'https://github.com/heiher/hev-socks5-tunnel'
  HEV_SHA: 'c5584feca8f6df70ee53eb2879e034b849a3d15a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Ensure submodules are present
      run: |
        fetch_sub() { # dir repo sha
          if [ -z "$(ls -A "$1" 2>/dev/null)" ]; then
            echo "Submodule $1 is missing, cloning $2 at $3"
            rm -rf "$1"
            git clone --recursive "$2" "$1"
            git -C "$1" checkout "$3"
            git -C "$1" submodule update --init --recursive
          fi
        }
        fetch_sub AndroidLibXrayLite "$XRAY_LIB_REPO" "$XRAY_LIB_SHA"
        fetch_sub hev-socks5-tunnel "$HEV_REPO" "$HEV_SHA"
        git -C AndroidLibXrayLite fetch --tags --force || true

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
        echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
        # Pin the NDK used for packaging native libraries (inserted after compileSdk).
        sed -i "/compileSdk = /a\    ndkVersion = \"${NDK_VERSION}\"" V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.HEV_SHA }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Download libv2ray.aar (Xray core)
      run: |
        TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
        echo "AndroidLibXrayLite tag: $TAG"
        mkdir -p V2rayNG/app/libs
        curl -fL --retry 3 -o V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"

    - name: Prepare signing key
      env:
        KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "Using your own keystore from repository secrets"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SIGN_FILE=$RUNNER_TEMP/release.keystore"
            echo "SIGN_STORE_PASS=$KEYSTORE_PASSWORD"
            echo "SIGN_ALIAS=$KEY_ALIAS"
            echo "SIGN_KEY_PASS=$KEY_PASSWORD"
          } >> $GITHUB_ENV
        else
          echo "::warning::No APP_KEYSTORE_BASE64 secret, signing with the bundled public test key (fine for personal use)"
          {
            echo "SIGN_FILE=${{ github.workspace }}/V2rayNG/ci/novaray-release.keystore"
            echo "SIGN_STORE_PASS=novaray-public"
            echo "SIGN_ALIAS=novaray"
            echo "SIGN_KEY_PASS=novaray-public"
          } >> $GITHUB_ENV
        fi

    - name: Build APK
      working-directory: V2rayNG
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew --no-daemon assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file="$SIGN_FILE" \
          -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
          -Pandroid.injected.signing.key.alias="$SIGN_ALIAS" \
          -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"
        ls -la app/build/outputs/apk/playstore/release/
        VERSION=$(ls app/build/outputs/apk/playstore/release/ | sed -nE 's/^NovaRay_(.+)_universal\.apk$/\1/p' | head -1)
        echo "Built version: $VERSION"
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Run unit tests
      working-directory: V2rayNG
      continue-on-error: true
      run: ./gradlew --no-daemon testPlaystoreReleaseUnitTest

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v7
      with:
        name: NovaRay-${{ env.APP_VERSION }}
        path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
        Готовые APK. Какой скачать:
        - **universal** — подходит для любого телефона (если не знаете — берите его)
        - **arm64-v8a** — почти все телефоны после 2017 года (файл меньше)
        - **armeabi-v7a** — старые 32-битные телефоны
        - **x86 / x86_64** — эмуляторы и редкие планшеты
        NOTES
        gh release create "v${APP_VERSION}" \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "NovaRay ${APP_VERSION}" \
          --notes-file "$RUNNER_TEMP/notes.md" \
          --latest \
          V2rayNG/app/build/outputs/apk/playstore/release/*.apk
